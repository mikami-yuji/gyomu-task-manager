<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>依頼書進捗管理システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/authGuard.js"></script>
    <style>
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.3s ease-out; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900 p-4 min-h-screen">
    <div class="max-w-7xl mx-auto">
        <header class="bg-slate-700 rounded-xl shadow-sm p-4 mb-4 flex flex-col md:flex-row justify-between items-center gap-2">
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 010 3.75H5.625a1.875 1.875 0 010-3.75z"/></svg>
                    進捗管理画面
                </h1>
                <p class="text-xs text-slate-300 font-medium mt-0.5">※ 新しい依頼書や更新内容はブラウザを更新すると表示されます</p>
            </div>
            <div class="flex items-center gap-4">
                <a href="/management.html" class="flex items-center gap-1.5 text-sm font-semibold text-slate-200 hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75"/></svg>
                    管理画面
                </a>
                <a href="/viewer.html" class="flex items-center gap-1.5 text-sm font-semibold text-slate-200 hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    ビューア
                </a>
                <a href="/report.html" target="_blank" rel="noopener" class="flex items-center gap-1.5 text-sm font-semibold text-slate-200 hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/></svg>
                    日報ページ
                </a>

                <button onclick="window.apiLogout()" class="flex items-center gap-1.5 text-sm text-slate-300 hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/></svg>
                    ログアウト
                </button>
            </div>
        </header>

        <main>
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">

            <div class="px-4 pt-4 pb-0">
                <!-- ① 企画担当選択 -->
                <div class="flex items-center gap-3 mb-3">
                    <label class="text-base font-bold text-gray-700 flex-shrink-0 w-24">企画担当者</label>
                    <select id="plannerFilterSelect"
                        class="flex-1 max-w-xs p-2.5 border-2 border-gray-300 rounded-xl text-base font-semibold bg-white text-slate-700 focus:outline-none focus:border-slate-500"
                        onchange="window.handlePlannerFilterChange(this.value)"></select>
                </div>
            </div>

            <!-- ② ステータスボタン（admin.jsのrenderStatusFilterUIが描画） -->
            <div id="tabBar" class="px-4 border-b border-gray-200"></div>

            <!-- ③ 依頼日フィルタ（admin.jsのrenderDateFilterUIが描画） -->
            <div class="px-4 pt-2 pb-1" id="dateFilterBar"></div>

            <div class="px-4 pt-2 pb-4">
                <!-- ④ 検索・並び順 -->
                <div class="flex flex-col md:flex-row md:items-center gap-2 mb-3">
                    <div class="relative flex-1">
                        <input type="text" id="searchBar" placeholder="依頼番号、得意先、担当者、デザイン内容などで検索..." class="w-full p-2 pr-8 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-400 focus:border-transparent">
                        <button type="button" onclick="window.clearSearchBar()" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600" id="searchBarClearBtn">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                    <div class="flex items-center gap-1 flex-shrink-0">
                        <label for="sortKey" class="text-sm font-medium text-gray-500">並び順:</label>
                        <select id="sortKey" class="p-1.5 border border-gray-300 rounded-lg text-sm">
                            <option value="requestId" selected>依頼番号</option>
                            <option value="requestedAt">依頼日</option>
                            <option value="deliveryDate">仕上げ希望日</option>
                            <option value="completedAt">完了日</option>
                        </select>
                        <select id="sortOrder" class="p-1.5 border border-gray-300 rounded-lg text-sm">
                            <option value="desc">降順</option>
                            <option value="asc">昇順</option>
                        </select>
                    </div>
                </div>
                <div id="requestList" class="flex flex-col"></div>
            </div>
        </div>

        <p id="loadingMessage" class="text-center text-gray-400 mt-4 text-sm" style="display: none;">ロード中...</p>
        </main>
    </div>

    <!-- カンプ画像・別紙の拡大表示用モーダル -->
    <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden" onclick="if(event.target===this)window.closeImageModal()">
        <img id="imageModalImg" src="" class="max-h-[90vh] max-w-[90vw] rounded-lg shadow-2xl hidden">
        <iframe id="imageModalPdf" src="" class="w-[90vw] h-[90vh] bg-white rounded-lg shadow-2xl hidden"></iframe>
        <a id="imageModalDownloadBtn" href="" download class="absolute top-4 right-16 text-white bg-black bg-opacity-40 hover:bg-opacity-60 rounded-lg px-3 py-2 flex items-center gap-1.5 text-sm font-semibold transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
            ダウンロード
        </a>
        <button onclick="window.closeImageModal()" class="absolute top-4 right-4 text-white text-3xl leading-none hover:text-gray-300">&times;</button>
    </div>

    <script src="/admin.js"></script>
</body>
</html>
