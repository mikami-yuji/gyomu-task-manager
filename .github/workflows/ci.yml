name: CI / Lint & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 依存パッケージをインストール
        run: npm ci

      - name: Lint を実行
        run: npm run lint

      - name: ユニットテストを実行
        run: npm test

      - name: Next.js ビルドを検証
        run: npm run build
